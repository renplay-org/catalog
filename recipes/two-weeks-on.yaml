summary: >-
  Nate works an offshore oil rig: two weeks on the platform, two weeks home. When his college best
  friend Cole gets divorced and needs a place to stay "for a few weeks", Nate says yes. Then he
  flies back out to sea, and everything that happens at home reaches him through his phone: his
  wife's texts, Cole's social media, a nosy neighbor, the front-door lock log and a living-room
  camera he swore he'd never check.
