name: Publish catalog
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to notice art links that stopped working.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the index compatibility test builds the last schema 3 commit in a worktree.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Every image is fetched once and kept in .art-cache between runs.
      - uses: actions/cache@v4
        with:
          path: .art-cache
          key: art-cache-${{ hashFiles('recipes/*.yaml') }}
          restore-keys: art-cache-
      - run: npm run build
      - run: node --test scripts/*.test.mjs

  cloudflare:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .art-cache
          key: art-cache-${{ hashFiles('recipes/*.yaml') }}
          restore-keys: art-cache-
      - run: npm run build
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
