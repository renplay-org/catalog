name: Request a game
description: Ask for a game, or a newer version of one, to be added to the catalog
title: "Request: "
labels: [request]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! A few things first:

        - **Is it already there?** Search the [catalog](https://renplay-web.github.io/catalog.html) and the [open requests](https://github.com/renplay-web/catalog/issues?q=is%3Aissue+label%3Arequest). If the game is listed but your version is not, choose "A newer version" below.
        - **Renplay plays Ren'Py games** from their PC download (Windows, Linux or Mac): Ren'Py 8, and most Ren'Py 7 games. HTML games (Twine, and RPG Maker MV and MZ) play too. Unity and Godot PC builds, RPG Maker VX Ace and older, Wolf RPG and Kirikiri games cannot run in a browser.
        - **Only official sources.** Link the developer's own page (itch.io, Steam, Patreon, their website), never a download mirror. The catalog never hosts game files.

        A bot checks your request against the catalog and the game's page and comments with what it found.
  - type: dropdown
    id: kind
    attributes:
      label: What are you asking for?
      options:
        - A game that is not in the catalog
        - A newer version of a game in the catalog
        - Another edition of a game in the catalog (a season, a DLC, a different download)
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: The title as the developer writes it.
      placeholder: Pale Carnations
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: As the developer names it, from the download or the game's main menu.
      placeholder: "0.9.23, Ch4Up7, Episode 9…"
    validations:
      required: true
  - type: input
    id: developer
    attributes:
      label: Developer
      placeholder: Studio or person
  - type: input
    id: page
    attributes:
      label: Official page
      description: Where the developer publishes the game. itch.io pages are best, they also have the cover.
      placeholder: https://developer.itch.io/game
    validations:
      required: true
  - type: input
    id: f95
    attributes:
      label: F95zone thread (if there is one)
      placeholder: https://f95zone.to/threads/…
  - type: dropdown
    id: engine
    attributes:
      label: Which engine made it?
      description: Renplay's Add games page shows it once you add the download. itch.io pages say it under "Made with".
      options:
        - Ren'Py (a renpy folder next to a game folder)
        - Twine or another HTML game (it opens as a web page)
        - RPG Maker MV or MZ (a www or js folder with an index.html)
        - Godot (a .pck file next to the program)
        - Unity (a folder whose name ends in _Data, or a WebGL build)
        - Something else
        - I am not sure
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Engine version, if you know it
      description: "Renplay shows it on Add games and on the game's Details tab. For Ren'Py, `renpy/vc_version.py` in the download says `version = '8.2.1…'` (Ren'Py 8), or only `vc_version = 320` (Ren'Py 7)."
      placeholder: "8.2.1"
  - type: input
    id: archive
    attributes:
      label: Download file name
      description: The exact name of the PC download, so Renplay can recognize it.
      placeholder: Game-1.0-pc.zip
  - type: dropdown
    id: tried
    attributes:
      label: Did you try it in Renplay?
      options:
        - "No"
        - Yes, and it works
        - Yes, but something is wrong
        - Yes, and it does not install or start
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: If you tried it, what worked and what did not. For a failed install, paste the log from Renplay's Settings › Activity.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the catalog and the open requests for this game.
          required: true
        - label: The link is the developer's own page, not a download mirror.
          required: true
        - label: It is the PC release of a Ren'Py game.
          required: true
